<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Menu to X Animation</title>

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #f5f5f5;
      }

      button {
        background: none;
        border: none;
        cursor: pointer;
      }

      svg {
        width: 40px;
        height: 40px;
      }

      .line {
        transition:
          transform 0.3s ease,
          opacity 0.2s ease;
        transform-origin: center;
      }

      /* When active (X state) */
      .active .line1 {
        transform: translateY(6px) rotate(45deg);
      }

      .active .line2 {
        opacity: 0;
      }

      .active .line3 {
        transform: translateY(-3px) rotate(-45deg);
      }
    </style>
  </head>

  <body>
    <button id="menuBtn">
      <svg viewBox="0 0 24 24" fill="none">
        <path
          class="line line1"
          d="M4 6H20"
          stroke="#000000bb"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          class="line line2"
          d="M4 12H20"
          stroke="#000000bb"
          stroke-width="2"
          stroke-linecap="round"
        />
        <path
          class="line line3"
          d="M4 18H20"
          stroke="#000000bb"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <script>
      const API_URL =
        "https://questions.aloc.com.ng/api/v2/q?subject=mathematics";
      const API_KEY = "ALOC-042dc5afca780faf2da4";

      async function loadFiveQuestions() {
        const questions = [];

        for (let i = 0; i < 5; i++) {
          const res = await fetch(API_URL, {
            method: "GET",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
              AccessToken: API_KEY,
            },
          });

          const data = await res.json();
          questions.push(data.data);
        }

        renderQuestions(questions);
      }

      function renderQuestions(questions) {
        let html = "";

        questions.forEach((q, i) => {
          html += `
      <div style="margin-bottom:20px">
        <p><b>Q${i + 1}. ${q.question}</b></p>
        <ul>
          <li>A. ${q.option.a}</li>
          <li>B. ${q.option.b}</li>
          <li>C. ${q.option.c}</li>
          <li>D. ${q.option.d}</li>
        </ul>
        <p><small>Answer: ${q.answer.toUpperCase()}</small></p>
      </div>
    `;
        });

        document.getElementById("questionBox").innerHTML = html;
      }
    </script>
  </body>
</html>
