    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        background: #f8faff;
        color: #000;
      }

      .overallcontainer {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding-bottom: 40px;
      }

      /* ==========================================
       HEADER
    ========================================== */

      .ovtext {
        color: #000000;
        margin: 30px;
        margin-bottom: 0;
        font-size: 25px;
      }

      .subovtext {
        color: #6b6b6b;
        font-size: 13px;
        margin: 5px 40px;
        font-weight: normal;
      }

      /* ==========================================
       TOP 3 CONTAINER
    ========================================== */

      .ovboxcons {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 0;
      }

      /* ==========================================
       TOP 3 CARDS
    ========================================== */

      .ovtopbox {
        display: grid;
        justify-items: center;
        background-color: white;
        border-radius: 16px 16px 0 0;
        padding: 5px 10px;
        width: 200px;
        border: 1px solid #e8e8e8;
        border-bottom: 2px ridge #2563eb;
        margin: 0 10px;
        overflow: hidden;
        transition: 0.25s linear;
        cursor: pointer;
      }

      .ovtopbox:hover {
        background-color: #f8fbff;
      }

      .ovtopbox:first-child {
        padding-bottom: 25px;
        width: 210px;
        box-shadow: 0 0 20px #2564eb35;
        order: 2;
      }

      .ovtopbox:last-child {
        padding-bottom: 10px;
        order: 3;
      }

      .ovtopbox:nth-child(2) {
        padding-bottom: 20px;
        order: 1;
      }

      /* ==========================================
       RANK
    ========================================== */

      .firsticonbox {
        margin-right: auto;
      }

      .firsticonbox p {
        font-size: 12px;
        color: #2563eb;
        font-weight: 600;
        margin: 8px 0;
      }

      /* ==========================================
       PROFILE IMAGE
    ========================================== */

      .profileimage {
        border-radius: 50%;
        background-color: #2563eb;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        height: 80px;
        width: 80px;
        overflow: hidden;
        flex-shrink: 0;
      }

      .ovtopbox:first-child .profileimage {
        height: 100px;
        width: 100px;
      }

      /* IMPORTANT:
       Dynamically inserted profile image
    */

      .profileimage img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        border-radius: 50%;
      }

      .profileimage p {
        font-size: 20px;
        margin: 0;
      }

      /* ==========================================
       USERNAME
    ========================================== */

      .usernamebox {
        margin-top: 5px;
        max-width: 180px;
        overflow: hidden;
      }

      .usernamebox p {
        font-weight: 500;
        font-size: 16px;
        margin: 0;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ==========================================
       MEDAL SVG
    ========================================== */

      .svgposbox {
        margin-top: 10px;
        background-color: #ebebeb68;
        padding: 5px 7px;
        border-radius: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ==========================================
       XP
    ========================================== */

      .totalscorebox {
        margin-top: 10px;
      }

      .totalscorebox p {
        color: #6b6b6b;
        font-size: 13px;
        margin: 0;
      }

      /* ==========================================
       GLOBAL RANKINGS
    ========================================== */

      .globrankdiv {
        background-color: #fff;
        border: 1px solid #d2d4e4;
        border-radius: 16px;
        margin: 20px 30px;
        margin-top: 30px;
        padding: 20px 0;
        padding-bottom: 0;
        overflow: hidden;
      }

      .globrankdiv h3 {
        margin: 10px;
        margin-bottom: 5px;
        margin-top: 0;
        font-size: 18px;
      }

      .globdetails {
        border-bottom: 1px solid #d2d4e4;
        padding: 10px;
        padding-top: 0;
        color: #6b6b6b;
        font-size: 12px;
        margin: 0;
      }

      .globboxcon {
        display: grid;
      }

      /* ==========================================
       GLOBAL ROW
    ========================================== */

      .globboxes {
        display: flex;
        border-bottom: 1px solid #d2d4e4;
        align-items: center;
        padding: 15px 8px;
        min-height: 62px;
      }

      .globboxes:last-child {
        border-bottom: none;
      }

      /* ==========================================
       GLOBAL RANK
    ========================================== */

      .globrank {
        font-weight: 500;
        margin: 0 15px;
        font-size: 14px;
        color: #6e6e6e;
        width: 15px;
        text-align: center;
        flex-shrink: 0;
      }

      /* ==========================================
       GLOBAL PROFILE
    ========================================== */

      .globprofile {
        border-radius: 50%;
        background-color: #2563eb;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        margin-left: 10px;
        margin-right: 10px;
        height: 30px;
        width: 30px;
        overflow: hidden;
        flex-shrink: 0;
      }

      /* IMPORTANT:
       Global ranking profile image
    */

      .globprofile img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        border-radius: 50%;
      }

      .globprofile p {
        margin: 0;
        font-size: 13px;
      }

      /* ==========================================
       GLOBAL NAME
    ========================================== */

      .globname {
        margin: 0;
        font-size: 14px;
        font-weight: 500;

        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;

        min-width: 0;
      }

      /* ==========================================
       GLOBAL XP
    ========================================== */

      .globxp {
        margin-left: auto;
        margin-right: 10px;
        color: #6b6b6b;
        font-size: 13px;
        white-space: nowrap;
      }

      .floatingdetails {
        position: sticky;
        background: #fff;
        border-radius: 16px;
        border: 1px solid #ccc;
        padding: 10px;
        bottom: 3%;
        margin-left: auto;
        right: 5%;
        width: max-content;
      }

      .floatingcover {
        display: flex;
        align-items: center;

        height: 100%;
      }

      .fposition {
        margin-right: 10px;
        color: #2563eb;
      }

      .floatingusername {
        margin-right: 10px;
        font-size: 15px;
      }

      .floatinguserxp {
        color: #6b6b6b;
        font-size: 12px;
      }

      .floatinguserxp span {
        font-weight: 600;
      }

      /* ==========================================
       MOBILE
    ========================================== */

      @media (max-width: 700px) {
        .ovtext {
          margin: 25px 20px 0;
          font-size: 22px;
        }

        .subovtext {
          margin: 5px 25px;
        }

        .ovboxcons {
          margin-top: 30px;
          width: 100%;
          overflow-x: auto;
          justify-content: center;
          padding: 0 5px;
        }

        .ovtopbox {
          width: 145px;
          min-width: 145px;
          margin: 0 4px;
        }

        .ovtopbox:first-child {
          width: 155px;
          min-width: 155px;
        }

        .profileimage {
          width: 65px;
          height: 65px;
        }

        .ovtopbox:first-child .profileimage {
          width: 80px;
          height: 80px;
        }

        .usernamebox {
          max-width: 130px;
        }

        .usernamebox p {
          font-size: 14px;
        }

        .globrankdiv {
          margin: 20px 15px;
          margin-top: 25px;
        }

        .globboxes {
          padding: 14px 5px;
        }

        .globrank {
          margin: 0 8px;
        }

        .globprofile {
          margin-left: 5px;
          margin-right: 8px;
        }

        .globname {
          font-size: 13px;
        }

        .globxp {
          font-size: 12px;
          margin-right: 8px;
        }
      }

      /* ==========================================
       SMALL MOBILE
    ========================================== */

      @media (max-width: 420px) {
        .overallcontainer{
          padding-top: 40px ;
        }
        .ovboxcons {
          justify-content: flex-start;
          overflow-x: auto;
          padding-left: 10px;
          padding-right: 10px;
        }

        .ovtopbox {
          width: 135px;
          min-width: 135px;
        }

        .ovtopbox:first-child {
          width: 145px;
          min-width: 145px;
        }

        .globrankdiv {
          margin-left: 10px;
          margin-right: 10px;
        }
      }

      .current-user-podium {
        border: 2px solid #2563eb;

        position: relative;
      }

      .current-user-podium::after {
        content: "YOU";
        position: absolute;
        top: 10px;
        right: 10px;
        background: #2563eb;
        color: #fff;
        font-size: 9px;
        font-weight: 700;
        padding: 4px 7px;
        border-radius: 20px;
        letter-spacing: 0.5px;
      }

      .current-user-ranking {
        background: #eff6ff;
        border-left: 3px solid #2563eb;
      }

      .current-user-ranking .globrank {
        color: #2563eb;
        font-weight: 700;
      }

      .current-user-ranking .globname {
        color: #2563eb;
        font-weight: 600;
      }
