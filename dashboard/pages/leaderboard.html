<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .leaderboardbody {
        padding: 0px 0px;
      }
      .leaderboardtext {
        margin: 30px;
        font-size: 30px;
        color: #000000bb;
      }

      .leaderconbox {
        width: 70%;
        margin: 20px auto;
      }

      .leaderboxes {
        background-color: #fff;
        width: 90%;
        margin: 20px auto;

        max-height: 100px;
        border-radius: 16px;
        border: 1px #dadada solid;
        display: flex;
        align-items: center;
        padding: 20px 20px;
        cursor: pointer;
        transition: 0.125s linear;
      }

      .leaderboxes svg {
        margin-left: 20px;
        margin-right: 20px;
      }

      .leaderboxes:hover {
        background-color: #f8fbff;
        border-color: #2563eb;
        box-shadow: 0 6px 18px #2563eb15;
        transform: translateY(-2px);
      }

      .leaderboxes h3 {
        font-weight: 500;
        font-size: 16px;
      }

      /* =========================
   DARK THEME
========================= */

      body.dark {
        background-color: #0f172a;
        color: #f8fafc;
      }

      body.dark .leaderboardtext {
        color: #f8fafc;
      }

      body.dark .leaderboxes {
        background-color: #151c24;
        border-color: #303943;
        box-shadow: 0 4px 14px #00000040;
      }

      body.dark .leaderboxes:hover {
        background-color: #202b38;
        border-color: #2563eb;
        box-shadow: 0 6px 18px #00000045;
      }

      body.dark .leaderboxes h3 {
        color: #f8fafc;
      }

      @media (max-width: 600px) {
        .leaderboardbody {
          padding-top: 40px;
        }

        .leaderboardtext {
          font-size: 26px;
        }

        .leaderboxes svg {
          margin-left: 0px;
          margin-right: 10px;
        }

        .leaderconbox {
          width: 80%;
        }

        .leaderconbox h3 {
          font-size: 15px;
        }
      }
    </style>
  </head>
