<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBT Practice</title>

    <style>
      .practicetext {
        margin: 30px;
        text-align: left;
        color: #000000bb;
        transition: color 0.25s linear;
        font-size: 30px;
        font-weight: 700;
      }

      .practicebody {
        width: 100%;
        transition:
          opacity 0.25s linear,
          color 0.25s linear;
        text-align: center;
      }

      .practicebody.remove {
        text-align: left;
      }

      #practicebody.opacity {
        opacity: 0;
      }

      .freepracticecontainer,
      .premiumpracticecontainer {
        background-color: #ffffff;
        width: 70%;
        margin: 15px 10px 0;
        padding: 20px 30px;
        text-align: left;
        display: inline-flex;
        align-items: center;
        border-radius: 14px;
        border: 1px solid #e8e8e8;
        cursor: pointer;
        transition:
          background-color 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease,
          transform 0.25s ease;
        box-sizing: border-box;
      }

      .freepracticecontainer h3 {
        margin: 0 0 0 20px;
        color: #222222;
        transition: color 0.25s linear;
        font-size: 16px;
        font-weight: 600;
      }

      .freepracticecontainer:hover {
        background-color: #f8fbff;
        border-color: #2563eb;
        box-shadow: 0 6px 18px #2563eb15;
        transform: translateY(-2px);
      }

      .freepracticecontainer:active {
        transform: translateY(0);
        box-shadow: 0 3px 10px #2563eb10;
      }

      .freepracticecontainer:nth-child(3) {
        margin-bottom: 10px;
      }

      #selectcover {
        width: 300px;
        border: 1px solid #e8e8e8;
        cursor: pointer;
        background-color: #ffffff;
        position: relative;
        display: flex;
        border-radius: 10px;
        justify-content: center;
        transition:
          background-color 0.25s ease,
          border-color 0.25s ease,
          box-shadow 0.25s ease;
        margin-top: 20px;
        margin-bottom: 30px;
        box-sizing: border-box;
      }

      #selectcover:hover {
        background-color: #f8fbff;
        border-color: #2563eb;
        box-shadow: 0 5px 16px #2563eb12;
      }

      #selectcover:hover select {
        background-color: #f8fbff;
      }

      select {
        width: 85%;
        transition:
          background-color 0.25s linear,
          color 0.25s linear;
        text-align: left;
        display: inline-flex;
        padding: 20px 0;
        text-overflow: ellipsis;
        font-size: 15px;
        cursor: pointer;
        outline: none;
        border: none;
        color: #6b6b6b;
        background-color: #ffffff;
      }

      select::-webkit-scrollbar {
        display: none;
      }

      label {
        margin-top: 30px;
        text-align: left;
      }

      .firstrow,
      .secondrow {
        display: grid;
        width: 90%;
        padding: 0 5%;
        justify-items: center;
        grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
        gap: 0 40px;
      }

      .inputs {
        outline: none;
        border: 1px solid #e8e8e8;
        box-shadow: 0 4px 14px #0000000d;
        width: 270px;
        padding: 5px 15px;
        height: 50px;
        border-radius: 10px;
        font-size: 16px;
        color: rgb(83, 83, 83);
        margin: 20px 0;
        background-color: #ffffff;
        transition:
          background-color 0.25s linear,
          color 0.25s linear,
          border-color 0.25s linear,
          box-shadow 0.25s ease;
        box-sizing: border-box;
      }

      .preflabels {
        text-align: left;
      }

      .inputs::-webkit-input-placeholder {
        color: #8d8d8d;
      }

      .inputs::placeholder {
        color: #8d8d8d;
      }

      .inputs:focus {
        background-color: #f8fbff;
        border-color: #2563eb;
        box-shadow: 0 4px 14px #2563eb12;
      }

      .startbtn {
        background: #2563eb;
        border:none;
        color: #ffffff;
        font-size: 17px;
        display: flex;
        border-radius: 10px;
        margin-left: auto;
        margin-right: 5%;
        margin-bottom: 20px;
        height: 45px;
        width: 100px;
        justify-content: center;
        align-items: center;
        outline: none;
        transition: 0.25s linear;
        cursor: pointer;
      }

      .startbtn:hover {
        background-color: #f1f5f9;
        border-color: #2563eb;
        color: #2563eb;
      }

      .startbtn:active {
        opacity: 0.7;
        background: #2563eb;
        color: #f1f5f9;
        transform: scale(0.97);
      }

      .questbody {
        width: 100%;
      }

      .questtext {
        margin: 30px;
        font-size: 30px;
        color: #000000bb;
      }

      option:disabled {
        color: #8d8d8d;
      }

      .examsbox {
        display: inline-block;
      }

      body.dark .practicetext {
        color: #ffffff;
      }

      body.dark .practicebody {
        color: #ffffff;
      }

      body.dark .freepracticecontainer,
      body.dark .premiumpracticecontainer {
        background-color: #151c24;
        border-color: #303943;
        box-shadow: 0 4px 14px #00000040;
      }

      body.dark .freepracticecontainer h3 {
        color: #ffffff;
      }

      body.dark .freepracticecontainer:hover {
        background-color: #202b38;
        border-color: #2563eb;
        box-shadow: 0 6px 18px #00000045;
      }

      body.dark #selectcover {
        background-color: #151c24;
        border-color: #303943;
        box-shadow: 0 4px 14px #00000040;
      }

      body.dark #selectcover:hover {
        background-color: #202b38;
        border-color: #2563eb;
      }

      body.dark #selectcover:hover select {
        background-color: #202b38;
      }

      body.dark select {
        background-color: #151c24;
        color: #ffffff;
      }

      body.dark select:focus {
        color: #ffffff;
      }

      body.dark option {
        background-color: #151c24;
        color: #ffffff;
      }

      body.dark option:disabled {
        color: #697582;
      }

      body.dark .inputs {
        background-color: #151c24;
        color: #ffffff;
        border-color: #303943;
        box-shadow: 0 4px 14px #00000040;
      }

      body.dark .inputs::placeholder {
        color: #7f8a96;
      }

      body.dark .inputs:focus {
        background-color: #202b38;
        color: #ffffff;
        border-color: #2563eb;
        box-shadow: 0 4px 14px #00000045;
      }

      body.dark .startbtn {
        background-color: #2563eb;
        border-color: #2563eb;
        color: #ffffff;
      }

      body.dark .startbtn:hover {
        background-color: #1d4ed8;
        border-color: #1d4ed8;
        color: #ffffff;
      }

      body.dark .startbtn:active {
        background-color: #1e40af;
        color: #ffffff;
      }

      body.dark .questtext {
        color: #ffffff;
      }

      body.dark #colorhat {
        stroke: #fff;
      }

      @media (max-width: 600px) {
        .practicebody{
          padding-top: 40px;
        }
        .practicetext {
          margin: 25px 20px;
          font-size: 26px;
        }

        .freepracticecontainer,
        .premiumpracticecontainer {
          width: 75%;
          padding: 18px 20px;
          border-radius: 12px;
        }

        .freepracticecontainer h3 {
          font-size: 15px;
          margin-left: 15px;
        }

        #selectcover {
          
        }

        .inputs {
          width: 75%;
        }

        .firstrow,
        .secondrow {
          width: 100%;
          padding: 0;
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="practicebody" id="practicebody">
      <h1 class="practicetext">Practice</h1>

      <div class="examsbox">
        <div class="freepracticecontainer" id="jambbutton">

  </body>
</html>
