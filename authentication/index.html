    <link rel="icon" href="./assets/prepIcons.png" type="image/png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./authentication/auth.css" />
    <link rel="stylesheet" href="./components/toast.css" />
    <title>PrepWire | Login & Register</title>
  </head>

  <body>
    <div class="authbox">

        <h1><span style="color: #2563eb">P</span>repWire</h1>
      </div>

      <div class="toggle">
        <div class="indicator" id="indicator"></div>

        <button id="loginbtn" onclick="showLogin()">Login</button>
        <button id="registerbtn" onclick="showRegister()">Register</button>

          id="loginEmail"
          placeholder="Email"

        <div class="rememberMe">
          <input
            type="checkbox"
            name="checkbox"
            id="checkbox"
          />

          <label for="checkbox">Remember Me</label>
        </div>

        <button
          class="submit"
          onclick="Login()"
          id="loginSubmit"
        >
          Login
        </button>

        <a
          id="resendConfirmation"
          href="#"
          style="display: none;"
        >
          Resend confirmation email
        </a>
      </section>

      <!-- Register form -->
      <section id="registerForm">
        <input
          type="text"
          name=""
          id="username"
          placeholder="Full Name"
          maxlength="50"
        />

        <input
          type="email"
          name=""
          id="signupEmail"
          placeholder="Email"
        />

        <div class="passbox" id="passbox">
          <input
            type="password"
            name=""
            id="signupPassword"
            class="password"
            onfocus="Focus()"
            onblur="Blur()"
            placeholder="Create Password"
            maxlength="30"
          />

            width="20px"
            height="20px"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
            transform="matrix(1, 0, 0, 1, 0, 0)"
            id="eyesvg"
            onclick="showPassword()"

              stroke-linecap="round"
              stroke-linejoin="round"

        <input
          type="password"
          name=""
          id="confirmPassword"
          placeholder="Confirm Password"
          maxlength="30"
        />

        <button
          class="submit"
          onclick="signUp()"
          id="signupSubmit"
          aria-label="hello"
        >
          Register
        </button>
      </section>
    </div>

    <script src="./authentication/index.js"></script>

    <script type="module">
      import {
        signUp,
        login,
        setupResendConfirmation
      } from "./authentication/auth.js";

      function signupValidation() {
        if (
          signupEmail.value.length >= 6 &&
          username.value.length >= 3 &&
          signupPassword.value.length > 5 &&
          confirmPassword.value == signupPassword.value
        ) {
          window.signUp = signUp;
          signupSubmit.classList.add("active");
        } else {
          signupSubmit.classList.remove("active");
          window.signUp = console.log("");
        }
      }

      setInterval(signupValidation, 300);

      function loginValidation() {
        if (
          loginEmail.value.length >= 6 &&
          loginPassword.value.length > 5
        ) {
          window.Login = login;
          loginSubmit.classList.add("active");
        } else {
          loginSubmit.classList.remove("active");
          window.Login = console.log("");
        }
      }

      setInterval(loginValidation, 300);

      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          localStorage.setItem("rememberMe", true);
        } else {
          localStorage.removeItem("rememberMe");
          localStorage.removeItem("showemail");
          localStorage.removeItem("showpassword");
        }
      });

      setupResendConfirmation();
    </script>
  </body>
  </html>
