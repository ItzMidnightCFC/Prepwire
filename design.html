<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Floating Calculator</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Calculator (hidden by default) */
      .calculator {
        position: fixed;
        top: 100px;
        left: 100px;
        width: 260px;
        background: #007a08;
        border-radius: 10px;
        padding: 10px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        z-index: 9999;
        display: none; /* 👈 IMPORTANT */
      }

      /* Header */
      .calc-header {
        background: #222;
        color: #fff;
        padding: 8px;
        cursor: move;
        border-radius: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .minimize-btn {
        background: red;
        border: none;
        color: white;
        padding: 3px 8px;
        cursor: pointer;
        border-radius: 4px;
      }

      /* Floating open button */
      .open-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #007a08;
        color: #fff;
        border: none;
        padding: 15px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        z-index: 9999;
      }

      /* Display */
      .display {
        width: 92%;
        height: 50px;
        font-size: 20px;
        text-align: right;
        padding: 10px;
        border: none;
        outline: none;
        margin-bottom: 10px;
        border-radius: 5px;
      }

      /* Buttons */
      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
      }

      button {
        padding: 15px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .operator {
        background: orange;
        color: #fff;
      }

      .equal {
        background: #222;
        color: #fff;
        grid-column: span 2;
      }

      .clear {
        background: red;
        color: #fff;
      }

      /* MOBILE FULLSCREEN */
      @media (max-width: 768px) {
        .calculator {
          top: 0 !important;
          left: 0 !important;
          width: 100%;
          height: 100%;
          border-radius: 0;
        }

        .display {
          height: 70px;
          font-size: 24px;
        }

        button {
          padding: 20px;
          font-size: 18px;
        }

        .calc-header {
          cursor: default;
        }
      }
    </style>
  </head>

  <body>
    <!-- Calculator -->
    <div class="calculator" id="calculator">
      <div class="calc-header" id="dragHandle">
        <img src="./assets/icon.png" alt="" width="20px" />
        <span>Calculator</span>
        <button class="minimize-btn" onclick="minimize()">—</button>
      </div>

      <input type="text" id="display" class="display" readonly />

      <div class="buttons">
        <button onclick="clearDisplay()" class="clear">C</button>
        <button onclick="append('%')">%</button>
        <button onclick="append('/')">÷</button>
        <button onclick="append('*')">×</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('-')" class="operator">−</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('+')" class="operator">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="calculate()" class="equal">=</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
      </div>
    </div>

    <!-- Floating Button (always visible) -->
    <button class="open-btn" id="openBtn" onclick="openCalc()">🧮</button>

    <script>
      const display = document.getElementById("display");
      const calc = document.getElementById("calculator");
      const openBtn = document.getElementById("openBtn");

      function append(value) {
        display.value += value;
      }

      function clearDisplay() {
        display.value = "";
      }

      function calculate() {
        try {
          display.value = eval(display.value);
        } catch {
          display.value = "Error";
        }
      }

      /* OPEN + MINIMIZE */
      function openCalc() {
        calc.style.display = "block";
        openBtn.style.display = "none";
      }

      function minimize() {
        calc.style.display = "none";
        openBtn.style.display = "block";
      }

      /* DRAG */
      const handle = document.getElementById("dragHandle");

      let isDragging = false;
      let offsetX, offsetY;

      handle.addEventListener("mousedown", (e) => {
        if (window.innerWidth <= 768) return;
        isDragging = true;
        offsetX = e.clientX - calc.offsetLeft;
        offsetY = e.clientY - calc.offsetTop;
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        calc.style.left = e.clientX - offsetX + "px";
        calc.style.top = e.clientY - offsetY + "px";
      });

      document.addEventListener("mouseup", () => {
        isDragging = false;
      });
    </script>
  </body>
</html>
